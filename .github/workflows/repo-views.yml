name: Collect repo views

on:
  schedule:
    - cron: "17 3 * * *"   # daily; the traffic API only keeps 14 days
  workflow_dispatch:

permissions:
  contents: write   # lets the built-in token commit the data files

concurrency:
  group: repo-views
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/collect_repo_views.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update repo view stats"
          git push
